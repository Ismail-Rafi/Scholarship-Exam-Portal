{% extends 'base.html' %}
{% block title %}Contact Support{% endblock %}
{% block content %}
<div class="form-box">
    <h2>Contact Support</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>Subject</label>{{ form.subject }}</div>
        <div class="form-group"><label>Message</label>{{ form.message }}</div>
        <button type="submit" class="btn">Send Message</button>
    </form>
</div>
{% endblock %}
