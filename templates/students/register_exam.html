{% extends 'base.html' %}
{% block title %}Apply for Exam{% endblock %}
{% block content %}
<div class="form-box">
    <h2>Apply for an Exam</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Select Exam</label>
            {{ form.exam }}
        </div>
        <button type="submit" class="btn">Submit Application</button>
    </form>
</div>
{% endblock %}
